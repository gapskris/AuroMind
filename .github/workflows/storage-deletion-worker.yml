name: Storage Deletion Queue Scheduled Worker

# ------------------------------------------------------------------------------
# AuroMasti — Asynchronous Storage Deletion Queue Processor
# ------------------------------------------------------------------------------
# Processes pending soft-deleted avatar and artwork assets asynchronously:
# - Runs hourly via cron schedule
# - Can be triggered manually via workflow_dispatch
# - Concurrency group 'storage-worker' prevents overlapping worker execution
# - Bounded processing (LIMIT 50 per run) with exponential backoff retry caps
# ------------------------------------------------------------------------------

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-worker
  cancel-in-progress: false

jobs:
  process-queue:
    name: Process Supabase Storage Deletion Queue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Execute Deletion Queue Worker
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: rlqrtbjynaihdspbqtce
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/process-storage-deletion-queue.mjs
